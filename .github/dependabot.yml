version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    # Security fixes can still create PRs. Inventory-only edits must not be merged:
    # update the actual hashed locks, metadata and file manifest after review.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
